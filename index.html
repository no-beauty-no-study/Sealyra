<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- v=116 — allow normal HTTP caching; cache-busting is handled per-asset
     by the ?v= query string below so a fresh push still invalidates.  -->
<meta name="theme-color" content="#0E0B1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Her Little Lexicon">
<title>Her Little Lexicon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=UnifrakturMaguntia&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<!-- Preload every background illustration in parallel so the
     screen-swap doesn't pause on a fresh download.                -->
<link rel="preload" as="image" href="assets/bg-cover.jpg?v=116">
<link rel="preload" as="image" href="assets/bg-stage.jpg?v=116">
<link rel="preload" as="image" href="assets/bg-result.jpg?v=116">
<link rel="preload" as="image" href="assets/bg-note.jpg?v=116">
<link rel="preload" as="image" href="assets/bg-stage0.jpg?v=116">
<link rel="preload" as="image" href="assets/banner.png?v=116">
<link rel="preload" as="image" href="assets/3C68C8E6-B3FB-43A6-AE2C-CBDE19872718.png?v=116">
<link rel="preload" as="image" href="assets/6794E86E-172C-4BB8-ACCB-A167D352E97B.png?v=116">
<link rel="preload" as="image" href="assets/E993B660-7AD9-4806-AA02-4ADC58F30901.png?v=116">

<link rel="stylesheet" href="styles.css?v=116">
</head>
<body>

<!-- Fixed atmospheric layer that sits behind every screen.  We swap
     its background-image via a body class (bg-cover / bg-stage / ...)
     so the illustration stays put while the actual page content
     scrolls over it.                                                 -->
<div id="bg-layer"></div>

<!-- Fixed banner at the very top of every screen. -->
<header id="banner-top">
  <img src="assets/banner.png?v=116" alt="Her Little Lexicon">
</header>

<!-- ===== App shell. Each <section> is one screen. =====
     Cover is the hub. Game flow is strictly linear; note + index
     are cover-side pages, not in the game flow. -->
<div id="app">

  <!-- Cover hub (the home) -->
  <section id="screen-cover"   class="screen"></section>

  <!-- v=116: stage 0 — pre-game reading article + 3-question quiz -->
  <section id="screen-stage0"      class="screen"></section>
  <section id="screen-stage0-quiz" class="screen"></section>

  <!-- Game flow: stage 1 → stage 2 → stage 3 -->
  <section id="screen-stage1"        class="screen"></section>
  <section id="screen-stage1-result" class="screen"></section>
  <section id="screen-stage2"        class="screen"></section>
  <section id="screen-stage2-result" class="screen"></section>
  <section id="screen-stage3"        class="screen"></section>
  <section id="screen-stage3-result" class="screen"></section>

  <!-- Cover-side: archive + word index -->
  <section id="screen-note"        class="screen"></section>
  <!-- Note → bucket grid (soft slips / haunting words) -->
  <section id="screen-note-bucket" class="screen"></section>
  <section id="screen-index"       class="screen"></section>

  <!-- Vocab card detail (opened from note / index with the tarot flip) -->
  <section id="screen-card" class="screen"></section>

  <!-- v=116: chapter catalog (cover-side; pick a chapter to play) -->
  <section id="screen-chapter-catalog" class="screen"></section>

</div>

<!-- Modal layer -->
<div id="modal" class="modal-veil"></div>

<!-- Data + BGM + App  ----- loaded in order.  Query-string cache-buster
     forces the CDN edge to fetch the latest after every push.        -->
<script src="data.js?v=116"></script>

<!-- v=116 — V147 + V148 vocab (NORMALIZED LITE family).  Content
     lives once in the registry, all relationships ship word IDs.
     V148 overlays three policy files on top of V147.              -->
<script src="VOCAB_WORD_CONTENT_REGISTRY_LITE.js?v=116"></script>
<script src="VOCAB_READING_WORDS_LITE.js?v=116"></script>
<script src="VOCAB_EXTERNAL_WORDS_LITE.js?v=116"></script>
<script src="VOCAB_LEARNING_HEAD_WORDS_LITE.js?v=116"></script>
<script src="VOCAB_FAMILY_SHARED_CLUSTERS_LITE.js?v=116"></script>
<script src="VOCAB_KIN_CLEAN_LITE.js?v=116"></script>
<script src="VOCAB_KIN_WORD_SOURCE_HEAD_FAMILY_LITE.js?v=116"></script>
<script src="VOCAB_KIN_HEAD_BRIDGE_LITE.js?v=116"></script>
<script src="VOCAB_HEAD_TO_FAMILY_KIN_NAV_LITE.js?v=116"></script>
<script src="VOCAB_GROUP_CLEAN_LITE.js?v=116"></script>
<script src="VOCAB_WORD_ENTRY_POLICY_LITE.js?v=116"></script>
<script src="VOCAB_ENTRY_VISIBILITY_POLICY_LITE.js?v=116"></script>

<script src="bgm.js?v=116"></script>
<script src="app.js?v=116"></script>
<script>
  /* v=116 — service worker for offline-first asset caching.  Without
     this the user complained the page re-downloaded every asset on
     every visit; with this, the second open of the same version
     loads instantly from the local cache.                            */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
